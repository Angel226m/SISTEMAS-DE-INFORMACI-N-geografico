<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoRiesgo Perú v9.0 — Multi-Hazard Enterprise</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <meta name="description" content="GeoRiesgo Perú v9.0 — Plataforma geoespacial multi-hazard: sismos USGS, volcanes INGEMMET, susceptibilidad XGBoost, alertas EWS, IRC 7 amenazas, Sendai, STAC/COG." />
    <meta property="og:title"       content="GeoRiesgo Perú v9.0 Enterprise" />
    <meta property="og:description" content="Multi-hazard: sismos · volcanes · ML · EWS · IRC v9 · Sendai · STAC" />
    <meta property="og:type"        content="website" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        height: 100%; width: 100%;
        margin: 0; padding: 0;
        overflow: hidden;
        background: #ffffff;
        color: #0f172a;
      }

      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

      input[type=range] {
        -webkit-appearance: none;
        width: 100%; height: 4px;
        border-radius: 2px;
        outline: none;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #059669;
        cursor: pointer;
        box-shadow: 0 0 4px rgba(5,150,105,0.4);
        transition: transform 0.15s;
      }
      input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

      /* MapLibre overrides */
      .maplibregl-ctrl-attrib,
      .maplibregl-ctrl-logo { display: none !important; }
      .maplibregl-ctrl-group {
        background: rgba(255,255,255,0.94) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 10px !important;
        box-shadow: 0 4px 14px rgba(0,0,0,0.08) !important;
      }
      .maplibregl-ctrl-scale {
        background: rgba(255,255,255,0.9) !important;
        border: 1px solid #e2e8f0 !important;
        color: #64748b !important;
        font-family: 'DM Mono', monospace !important;
        font-size: 9px !important;
        border-radius: 6px !important;
        padding: 2px 6px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
