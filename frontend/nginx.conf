server {
    listen 80;
    server_name _;

    # ── DNS interno Docker ─────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compresión gzip ────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/javascript text/xml text/x-component
        application/javascript application/json application/geo+json
        application/xml application/xhtml+xml application/rss+xml
        application/atom+xml application/vnd.ms-fontobject
        font/truetype font/opentype image/svg+xml;

    # ── Healthcheck ────────────────────────────────────────
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── WebSocket EWS v9.0 — /ws/* → backend FastAPI ──────
    # Requiere upgrade HTTP→WebSocket para alert_worker.py
    location /ws/ {
        set $upstream http://backend:8000;
        proxy_pass             $upstream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_read_timeout     3600s;   # WebSocket persistente — 1 hora
        proxy_send_timeout     3600s;
        proxy_buffering        off;
    }

    # ── SSE EWS v9.0 — /api/v1/alertas/stream ────────────
    # Server-Sent Events requieren buffering off y timeout largo
    location = /api/v1/alertas/stream {
        set $upstream http://backend:8000;
        proxy_pass             $upstream;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        "";
        proxy_connect_timeout  10s;
        proxy_read_timeout     3600s;   # SSE persistente — 1 hora
        proxy_send_timeout     3600s;
        proxy_buffering        off;
        proxy_cache            off;
        # Headers SSE obligatorios
        add_header             Cache-Control     "no-cache";
        add_header             X-Accel-Buffering "no";
    }

    # ── Proxy /api/v1/* → backend FastAPI ─────────────────
    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass             $upstream;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;
        proxy_buffering        off;
        proxy_pass_header      ETag;
        proxy_pass_header      Cache-Control;
        proxy_pass_header      X-Cache;
        proxy_pass_header      X-RateLimit-Limit;
        proxy_pass_header      X-RateLimit-Remaining;
        proxy_pass_header      Retry-After;
    }

    # ── Assets estáticos — caché inmutable 1 año ──────────
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|webp|jpg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary         "Accept-Encoding";
        access_log off;
    }

    # ── SPA fallback ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Seguridad básica ───────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "same-origin"    always;
}